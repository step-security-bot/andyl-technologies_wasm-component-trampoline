name: 'Publishing'

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup devenv
        uses: andyl-technologies/github-actions/setup-devenv@4b005b192a0b5268eb7e5adc11be13f944de9e80 # master

      - name: Publish to crates.io
        uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b # v2
        with:
          registry-token: ${{ secrets.CRATES_IO_REPO_PUBLISH_TOKEN }}
